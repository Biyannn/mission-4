<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome cdn css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Biyan To Do List</title>
    <link rel="stylesheet" href="ketiga.css" />
  </head>
  <body>
    <h1>Biyan To do list</h1>
    <form action="">
      <div class="first">
      <input type="text" class="todo-input" />
      <input type="date" id="date" />
    </div>
      <div class='all'>
      <div class="select">
        <select name="level" id="level">
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <div class="select">
        <select
          name="todos"
          class="filter-todo"
          onChange="generateTodoList(filterOption.value)"
        >
          <option value="all">All</option>
          <option value="completed">Completed</option>
          <option value="incomplete">Incomplete</option>
        </select>
      </div>
      <button class="todo-button" type="submit" onClick="storeTodo(event)">
        <i class="fas fa-plus-circle fa-lg"></i>
      </button>
    </div>
    </form>

    <button type="reset" class="delete-all" onclick="deleteAllTodo(event)">
      Delete all
    </button>
    <div class="todo-container">
      <ul class="todo-list"></ul>
    </div>

    <script src="ketiga.js"></script>
  </body>
</html>
